<svg xmlns="http://www.w3.org/2000/svg" width="900" height="168" viewBox="0 0 900 168" role="img" aria-label="Four step deployment: choose a platform, we set it up, connect the catalogue, you go live">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#E0B01E"/>
    </linearGradient>
    <style>
      .n    { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 700; fill: #F5C518; }
      .t    { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #EDEDED; }
      .s    { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8C8C8C; letter-spacing: 0.4px; }
      .ring { fill: #0A0A0A; stroke: #F5C518; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="900" height="168" rx="10" fill="#070707"/>

  <line x1="110" y1="62" x2="790" y2="62" stroke="#242424" stroke-width="2"/>
  <line x1="110" y1="62" x2="790" y2="62" stroke="url(#gold)" stroke-width="2" stroke-dasharray="680" stroke-dashoffset="680">
    <animate attributeName="stroke-dashoffset" values="680;0;0" keyTimes="0;0.75;1" dur="6s" repeatCount="indefinite"/>
  </line>

  <circle cx="110" cy="62" r="5" fill="#FFE08A">
    <animate attributeName="cx" values="110;790" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <g text-anchor="middle">
    <g transform="translate(110,0)">
      <circle class="ring" cx="0" cy="62" r="24" stroke-opacity="0.3">
        <animate attributeName="stroke-opacity" values="0.3;1;1;0.3" keyTimes="0;0.04;0.26;0.3" dur="6s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text class="n" x="0" y="69">1</text>
      <text class="t" x="0" y="116">Choose a platform</text>
      <text class="s" x="0" y="134">casino &#183; sportsbook &#183; social</text>
    </g>
    <g transform="translate(337,0)">
      <circle class="ring" cx="0" cy="62" r="24" stroke-opacity="0.3">
        <animate attributeName="stroke-opacity" values="0.3;1;1;0.3" keyTimes="0;0.04;0.26;0.3" dur="6s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text class="n" x="0" y="69">2</text>
      <text class="t" x="0" y="116">We set it up</text>
      <text class="s" x="0" y="134">server &#183; domain &#183; theme</text>
    </g>
    <g transform="translate(563,0)">
      <circle class="ring" cx="0" cy="62" r="24" stroke-opacity="0.3">
        <animate attributeName="stroke-opacity" values="0.3;1;1;0.3" keyTimes="0;0.04;0.26;0.3" dur="6s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
      <text class="n" x="0" y="69">3</text>
      <text class="t" x="0" y="116">Connect the catalogue</text>
      <text class="s" x="0" y="134">Games API &#183; bonuses &#183; KYC</text>
    </g>
    <g transform="translate(790,0)">
      <circle class="ring" cx="0" cy="62" r="24" stroke-opacity="0.3">
        <animate attributeName="stroke-opacity" values="0.3;1;1;0.3" keyTimes="0;0.04;0.26;0.3" dur="6s" begin="4.2s" repeatCount="indefinite"/>
      </circle>
      <text class="n" x="0" y="69">4</text>
      <text class="t" x="0" y="116">You go live</text>
      <text class="s" x="0" y="134">registrations open</text>
    </g>
  </g>
</svg>
