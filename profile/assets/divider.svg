<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C518" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5C518" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F5C518" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFF6D5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="30" y="11" width="380" height="1.5" fill="url(#rule)"/>
  <rect x="490" y="11" width="380" height="1.5" fill="url(#rule)"/>
  <rect x="30" y="11" width="840" height="1.5" fill="url(#sweep)" opacity="0.7"/>

  <g transform="translate(450,12)">
    <path d="M0 -7 L5 0 L0 7 L-5 0 Z" fill="#F5C518">
      <animateTransform attributeName="transform" type="rotate" from="0" to="180" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
